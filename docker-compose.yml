# Kolej na Analizę — środowisko lokalne (RSA-002).
# Wszystkie porty hosta są wystawiane wyłącznie na 127.0.0.1.
# Uruchomienie: cp .env.example .env && docker compose up -d --build

name: ${COMPOSE_PROJECT_NAME:-railsafe}

# backend, migrate i worker dzielą jeden obraz (railsafe-backend:local), żeby
# `up --build` odświeżał także workera uruchamianego przez `docker compose run`.
x-backend-env: &backend-env
  POSTGRES_HOST: postgis
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-railsafe}
  POSTGRES_USER: ${POSTGRES_USER:-railsafe}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
  DEMO_MODE: ${DEMO_MODE:-true}
  PLK_API_KEY: ${PLK_API_KEY:-}

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railsafe}
      POSTGRES_USER: ${POSTGRES_USER:-railsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    ports:
      - "127.0.0.1:${POSTGIS_HOST_PORT:-55432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [railsafe]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Bez portu na hoście: model jest dostępny tylko dla backendu w sieci kontenerów.
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [railsafe]

  # Jednorazowe pobranie modelu (kilka GB przy pierwszym uruchomieniu).
  # Mapa i backend działają także wtedy, gdy pobieranie jeszcze trwa lub się nie uda.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:4b-instruct}"]
    networks: [railsafe]

  # Jednorazowo doprowadza schemat do najnowszej rewizji (tylko "upgrade", nigdy "downgrade").
  # Cofanie migracji wyłącznie ręcznie: docker compose run --rm migrate alembic downgrade -1
  migrate:
    build: ./backend
    image: railsafe-backend:local
    restart: "no"
    depends_on:
      postgis:
        condition: service_healthy
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    networks: [railsafe]

  backend:
    build: ./backend
    image: railsafe-backend:local
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8765}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=8)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks: [railsafe]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [railsafe]

  # Potoki importu/analiz uruchamiane ręcznie, np.:
  #   docker compose run --rm worker python -m app.worker import-crossings
  worker:
    build: ./backend
    image: railsafe-backend:local
    profiles: ["jobs"]
    depends_on:
      postgis:
        condition: service_healthy
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    volumes:
      # Raporty audytu danych generowane przez zadania importu.
      - ./reports:/reports
    networks: [railsafe]

networks:
  railsafe:

volumes:
  postgis_data:
  ollama_models:

