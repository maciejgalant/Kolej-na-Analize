name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: railsafe_test
          POSTGRES_USER: railsafe
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railsafe -d railsafe_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RAILSAFE_TEST_DB: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: railsafe_test
      POSTGRES_USER: railsafe
      POSTGRES_PASSWORD: ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build backend frontend
      - name: Uruchom stos bez Ollamy i sprawdź healthcheck
        run: |
          docker compose up -d --wait postgis backend frontend
          curl -fsS http://127.0.0.1:8080/api/v1/health | tee health.json
          grep -q '"database":{"status":"ok"' health.json
          grep -q '"schema_revision":"0004"' health.json
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
